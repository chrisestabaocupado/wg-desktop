[workspace]
members = ["crates/core", "crates/tunnel-userspace", "crates/proxy", "crates/windows", "crates/cli"]
resolver = "2"
exclude = ["vendor/winit"]

[patch.crates-io]
winit = { path = "vendor/winit" }

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
boringtun = { version = "0.7.1", default-features = false }
clap = { version = "4.5", features = ["derive"] }
ipnet = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-dns", "dns-max-server-count-2", "dns-max-result-count-8", "iface-max-addr-count-2", "iface-max-route-count-4"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"
wg-core = { path = "crates/core" }
wg-tunnel = { path = "crates/tunnel-userspace" }
wg-proxy = { path = "crates/proxy" }
wg-windows = { path = "crates/windows" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
